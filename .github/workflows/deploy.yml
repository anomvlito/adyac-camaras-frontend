name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/services/adyac-camaras-frontend
            git pull origin main
            npm ci
            npm run build
            sudo systemctl restart adyac-frontend
            sleep 3
            systemctl is-active --quiet adyac-frontend && echo "✓ adyac-frontend OK" || { echo "✗ servicio no levantó"; exit 1; }
